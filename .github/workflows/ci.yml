name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run PyTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest
        run: |
          PYTHONPATH=. pytest tests/

  build-and-push:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      # Using Docker Hub (assumes secrets are configured: DOCKER_USERNAME and DOCKER_PASSWORD)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Create empty models directory for Docker context
        run: mkdir -p models
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pneumonia-classifier:latest,${{ secrets.DOCKER_USERNAME }}/pneumonia-classifier:${{ github.sha }}

  deploy-and-test:
    name: Run CD & Smoke Tests
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Deploy via Docker Compose
        env:
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/pneumonia-classifier:${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d --no-build
          
      - name: Wait for API to boot
        run: sleep 10
        
      - name: Set up Python for test runner
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: pip install requests pillow
          
      - name: Run Smoke Tests
        run: python tests/smoke_test.py
        
      - name: Cleanup
        if: always()
        run: docker compose down
